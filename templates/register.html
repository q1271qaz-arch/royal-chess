{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<section class="auth-card">
    <p class="eyebrow">НОВЫЙ ИГРОК</p>
    <h1>Создание аккаунта</h1>
    <form method="post" class="form">
        <label>
            Имя игрока
            <input
                type="text"
                name="username"
                minlength="3"
                maxlength="40"
                required
            >
        </label>
        <label>
            Электронная почта
            <input type="email" name="email" required>
        </label>
        <label>
            Пароль
            <input
                type="password"
                name="password"
                minlength="6"
                required
            >
        </label>
        <button class="button primary" type="submit">
            Зарегистрироваться
        </button>
    </form>
</section>
{% endblock %}
